<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UNSIAO — 品牌入场动画</title>
<style>
  :root { --logo-h: 180px; --ink: #0a0a0a; --ease: cubic-bezier(0.16, 1, 0.3, 1); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }

  .stage {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- 粒子层 ---------- */
  #particleCanvas {
    position: absolute; inset: 0;
    z-index: 1; pointer-events: none;
    transition: opacity 0.55s ease;
  }
  #particleCanvas.hidden { opacity: 0; }

  /* ---------- 品牌层 ---------- */
  .brand-content {
    position: relative;
    z-index: 2;
    display: flex; align-items: center;
    opacity: 0;
    transition:
      opacity 0.45s ease,
      transform 1.05s var(--ease);
    will-change: transform, opacity;
  }
  .brand-content.active { opacity: 1; }

  .vector-logo { display: block; }

  /* 关键：文字绝对定位、不参与布局，保证粒子/矢量 LOGO 阶段严格居中 */
  .brand-text {
    position: absolute;
    left: 100%; top: 50%;
    transform: translateY(-50%);
    display: flex; align-items: center;
    margin-left: calc(var(--logo-h) * 0.14);
    gap: calc(var(--logo-h) * 0.05);
    white-space: nowrap;
    pointer-events: none;
  }

  .letter {
    display: inline-block;
    font-size: calc(var(--logo-h) * 0.27);
    font-weight: 800;
    color: var(--ink);
    opacity: 0;
    transform: translate(0.9em, 0.15em) scale(0.85);
    filter: blur(9px);
    transition:
      opacity 0.5s ease,
      transform 0.85s var(--ease),
      filter 0.55s ease;
    will-change: transform, opacity, filter;
  }
  .brand-content.show-text .letter {
    opacity: 1;
    transform: translate(0, 0) scale(1);
    filter: blur(0);
  }

  .product-version {
    position: absolute;
    left: 50%;
    top: calc(50% + var(--logo-h) * 0.66);
    z-index: 3;
    transform: translateX(-50%);
    color: #747474;
    font-size: calc(var(--logo-h) * 0.09);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  .product-version.visible { opacity: 1; }

  /* ---------- 右下角 Windows 风格 Loader ---------- */
  .win-loader-container {
    position: absolute;
    right: 40px;
    bottom: 40px;
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }
  .win-loader-container.visible {
    opacity: 1;
  }

  .win-loader {
    position: relative;
    width: 32px;
    height: 32px;
  }

  .win-loader .dot {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    animation: winSpin 3.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
  }

  .win-loader .dot::after {
    content: '';
    position: absolute;
    top: 0;
    left: 14px;
    width: 4px;
    height: 4px;
    background-color: var(--ink);
    border-radius: 50%;
  }

  .win-loader .dot:nth-child(1) { animation-delay: 0.12s; }
  .win-loader .dot:nth-child(2) { animation-delay: 0.24s; }
  .win-loader .dot:nth-child(3) { animation-delay: 0.36s; }
  .win-loader .dot:nth-child(4) { animation-delay: 0.48s; }
  .win-loader .dot:nth-child(5) { animation-delay: 0.60s; }

  @keyframes winSpin {
    0% { transform: rotate(0deg); opacity: 0; }
    5% { opacity: 1; }
    50% { transform: rotate(360deg); opacity: 1; }
    90% { transform: rotate(720deg); opacity: 0; }
    100% { transform: rotate(720deg); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .brand-content, .letter, #particleCanvas, .product-version, .win-loader-container { transition: none !important; }
    .win-loader .dot { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="particleCanvas"></canvas>

    <div class="brand-content" id="brandContent">
      <svg id="svgLogo" class="vector-logo" viewBox="0 0 1109 919" xmlns="http://www.w3.org/2000/svg">
        <path fill="#0a0a0a" d="
            M299.4 6.5 C354.6 6.2 409.8 6.4 465 6.4 471.6 6.5 478.3 5.8 484.8 7.4 497.1 10.3 508.7 19.1 512.5 31.5 515.5 41.1 516.6 51.6 514.2 61.5 509.6 79.1 504.9 96.6 499.7 114 492.8 138.1 486.1 162.2 479.2 186.2 473.2 209.3 466.1 232 460 255 437.4 336.4 414.7 417.8 392.2 499.2 380.1 540.7 369.4 582.4 357.8 624 346.5 664.5 335.3 705.1 324.6 745.8 318.8 767.3 313.4 788.9 307.3 810.3 301.2 833.1 295.5 856.1 289 878.8 286.6 887.9 282.1 896.6 275 902.9 266.8 909.9 255.5 912.3 245 911.6 180 911.6 115 911.7 50 911.6 35.7 912.1 21 904.3 14.6 891.3 9.2 880.2 10.5 867.1 13.3 855.4 19.5 830.3 27.3 805.6 34.5 780.8 37.9 768.9 41.9 757.3 45.2 745.4 57.6 703.3 70.7 661.4 83.1 619.3 89.4 599 95.2 578.5 101.5 558.2 107.8 537.8 113.7 517.3 120 496.9 131.2 461.2 141.8 425.2 153.4 389.6 167.3 344.7 181.1 299.8 195.2 255 208.9 209.5 223.8 164.4 238.1 119.2 247.9 90.1 256.5 60.7 266.7 31.8 271.6 18.1 284.5 6.8 299.4 6.5Z
            M581.4 6.5 C603.6 6.1 625.8 6.5 648 6.4 676.3 6.3 704.7 6.3 733 6.3 744.4 6.5 755.5 11.5 762.7 20.3 769.7 27.7 770.8 38.3 771.4 48 771.9 56.8 768.9 65.2 767.4 73.7 763.9 93.2 759.8 112.6 755.7 131.9 742.3 202.1 727.5 271.9 714.8 342.2 713.3 353.3 710.2 364.6 712.4 375.8 714.4 384.8 722 391.5 730.5 394.6 736 397 742 397.8 748 397.6 800.3 397.7 852.6 397.6 905 397.7 916.3 397.5 927.6 402.4 935.1 410.9 941.2 417.2 943.3 426 946.1 434.1 951.4 448.8 955.9 463.8 961.4 478.5 970.7 503.1 979.7 527.9 988.3 552.8 994.4 570.9 1001.5 588.5 1007.5 606.5 1016.9 630.7 1023.7 655.7 1033.2 679.7 1047.5 715.5 1061.6 751.4 1074.2 787.9 1079.6 801.9 1084 816.4 1089.7 830.3 1092.2 837 1094.7 843.7 1096.9 850.5 1100.2 861.7 1101.2 874 1097.2 885.1 1093.4 896.2 1084.1 905.2 1073.1 908.9 1065.4 911.9 1057.1 911.5 1049 911.5 900 911.7 751 911.5 602 911.6 587.4 911.6 572.4 903.7 565.7 890.4 562.2 883.5 561.4 875.6 561.9 868 563.3 852.1 567.3 836.6 570.4 820.9 579.3 777.9 588.4 734.9 598 692 613.2 625 627 557.6 642.3 490.6 643.8 482.4 646.2 474.3 647.2 466 648 460.1 646.7 453.8 643.1 449 636.6 439.6 625.4 433.8 614 433.7 572 433.6 530 433.7 488 433.7 477.7 433.8 466.6 430.3 460.2 421.8 454.1 414.7 451.5 405.2 451.5 396 451.3 388.8 453.8 382 455.3 375.1 460.9 354.9 465.8 334.5 471.1 314.2 477.1 291.9 483.8 269.8 489.6 247.4 495.9 224.2 502.1 201 508.9 177.9 513.6 160.1 518.5 142.4 523.6 124.7 530.4 99.9 537.1 75.1 544.3 50.3 546.4 43.4 547.6 36.1 550.7 29.5 555.7 17.1 567.9 7.5 581.4 6.5Z"/>
      </svg>

      <div class="brand-text" id="brandText">
        <span class="letter">U</span>
        <span class="letter">N</span>
        <span class="letter">S</span>
        <span class="letter">I</span>
        <span class="letter">A</span>
        <span class="letter">O</span>
      </div>
    </div>

    <div class="product-version" id="productVersion">UNCAD Pro · v{{VERSION}}</div>

    <div class="win-loader-container" id="loaderContainer">
      <div class="win-loader">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <script>
  (() => {
    'use strict';

    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    const brandContent = document.getElementById('brandContent');
    const svgLogo = document.getElementById('svgLogo');
    const brandText = document.getElementById('brandText');
    const letters = [...brandText.querySelectorAll('.letter')];
    const productVersion = document.getElementById('productVersion');
    const loaderContainer = document.getElementById('loaderContainer');

    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const TAU = Math.PI * 2;
    const LOGO_W = 1109, LOGO_H = 919;
    const svgPathData = `M299.4 6.5 C354.6 6.2 409.8 6.4 465 6.4 471.6 6.5 478.3 5.8 484.8 7.4 497.1 10.3 508.7 19.1 512.5 31.5 515.5 41.1 516.6 51.6 514.2 61.5 509.6 79.1 504.9 96.6 499.7 114 492.8 138.1 486.1 162.2 479.2 186.2 473.2 209.3 466.1 232 460 255 437.4 336.4 414.7 417.8 392.2 499.2 380.1 540.7 369.4 582.4 357.8 624 346.5 664.5 335.3 705.1 324.6 745.8 318.8 767.3 313.4 788.9 307.3 810.3 301.2 833.1 295.5 856.1 289 878.8 286.6 887.9 282.1 896.6 275 902.9 266.8 909.9 255.5 912.3 245 911.6 180 911.6 115 911.7 50 911.6 35.7 912.1 21 904.3 14.6 891.3 9.2 880.2 10.5 867.1 13.3 855.4 19.5 830.3 27.3 805.6 34.5 780.8 37.9 768.9 41.9 757.3 45.2 745.4 57.6 703.3 70.7 661.4 83.1 619.3 89.4 599 95.2 578.5 101.5 558.2 107.8 537.8 113.7 517.3 120 496.9 131.2 461.2 141.8 425.2 153.4 389.6 167.3 344.7 181.1 299.8 195.2 255 208.9 209.5 223.8 164.4 238.1 119.2 247.9 90.1 256.5 60.7 266.7 31.8 271.6 18.1 284.5 6.8 299.4 6.5Z M581.4 6.5 C603.6 6.1 625.8 6.5 648 6.4 676.3 6.3 704.7 6.3 733 6.3 744.4 6.5 755.5 11.5 762.7 20.3 769.7 27.7 770.8 38.3 771.4 48 771.9 56.8 768.9 65.2 767.4 73.7 763.9 93.2 759.8 112.6 755.7 131.9 742.3 202.1 727.5 271.9 714.8 342.2 713.3 353.3 710.2 364.6 712.4 375.8 714.4 384.8 722 391.5 730.5 394.6 736 397 742 397.8 748 397.6 800.3 397.7 852.6 397.6 905 397.7 916.3 397.5 927.6 402.4 935.1 410.9 941.2 417.2 943.3 426 946.1 434.1 951.4 448.8 955.9 463.8 961.4 478.5 970.7 503.1 979.7 527.9 988.3 552.8 994.4 570.9 1001.5 588.5 1007.5 606.5 1016.9 630.7 1023.7 655.7 1033.2 679.7 1047.5 715.5 1061.6 751.4 1074.2 787.9 1079.6 801.9 1084 816.4 1089.7 830.3 1092.2 837 1094.7 843.7 1096.9 850.5 1100.2 861.7 1101.2 874 1097.2 885.1 1093.4 896.2 1084.1 905.2 1073.1 908.9 1065.4 911.9 1057.1 911.5 1049 911.5 900 911.7 751 911.5 602 911.6 587.4 911.6 572.4 903.7 565.7 890.4 562.2 883.5 561.4 875.6 561.9 868 563.3 852.1 567.3 836.6 570.4 820.9 579.3 777.9 588.4 734.9 598 692 613.2 625 627 557.6 642.3 490.6 643.8 482.4 646.2 474.3 647.2 466 648 460.1 646.7 453.8 643.1 449 636.6 439.6 625.4 433.8 614 433.7 572 433.6 530 433.7 488 433.7 477.7 433.8 466.6 430.3 460.2 421.8 454.1 414.7 451.5 405.2 451.5 396 451.3 388.8 453.8 382 455.3 375.1 460.9 354.9 465.8 334.5 471.1 314.2 477.1 291.9 483.8 269.8 489.6 247.4 495.9 224.2 502.1 201 508.9 177.9 513.6 160.1 518.5 142.4 523.6 124.7 530.4 99.9 537.1 75.1 544.3 50.3 546.4 43.4 547.6 36.1 550.7 29.5 555.7 17.1 567.9 7.5 581.4 6.5Z`;

    const state = {
      running: false, finished: false, landed: false,
      particles: [],
      startTime: 0, endTime: 0,
      mouse: { x: -9999, y: -9999, sx: -9999, sy: -9999 },
      W: 0, H: 0, logoW: 0, logoH: 0,
      timers: []
    };

    /* ============ 布局（DPR 高清适配） ============ */
    function layout() {
      state.W = innerWidth;
      state.H = innerHeight;
      const dpr = Math.min(devicePixelRatio || 1, 2);

      canvas.width = state.W * dpr;
      canvas.height = state.H * dpr;
      canvas.style.width = state.W + 'px';
      canvas.style.height = state.H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      state.logoH = Math.min(state.W, state.H) * 0.18;
      state.logoW = state.logoH * (LOGO_W / LOGO_H);
      svgLogo.style.width = state.logoW + 'px';
      svgLogo.style.height = state.logoH + 'px';
      document.documentElement.style.setProperty('--logo-h', state.logoH + 'px');
    }

    /* 计算「整体左移多少才能让 LOGO+文字 组合居中」 */
    function computeShift() {
      const textW = brandText.offsetWidth;
      const margin = parseFloat(getComputedStyle(brandText).marginLeft) || 0;
      return (textW + margin) / 2;
    }

    /* ============ 离屏采样 LOGO 形状 ============ */
    function sampleLogo() {
      const tmp = document.createElement('canvas');
      tmp.width = state.W; tmp.height = state.H;
      const tctx = tmp.getContext('2d', { willReadFrequently: true });

      const s = state.logoH / LOGO_H;
      tctx.translate((state.W - state.logoW) / 2, (state.H - state.logoH) / 2);
      tctx.scale(s, s);
      tctx.fill(new Path2D(svgPathData));

      // 自适应密度：目标约 2400 颗粒子，兼顾观感与性能
      let gap = Math.sqrt((state.logoW * state.logoH * 0.38) / 2400);
      gap = Math.round(Math.min(7, Math.max(3, gap)));

      const data = tctx.getImageData(0, 0, state.W, state.H).data;
      const pts = [];
      for (let y = 0; y < state.H; y += gap) {
        for (let x = 0; x < state.W; x += gap) {
          if (data[(y * state.W + x) * 4 + 3] > 128) pts.push({ x, y });
        }
      }
      return { pts, gap };
    }

    /* ============ 粒子：定时补间 + 弧线轨迹 ============ */
    class Particle {
      constructor(tx, ty, gap, sweepAt) {
        this.tx = tx; this.ty = ty;

        // 从视口外随机方位飞入
        const ang = Math.random() * TAU;
        const rad = Math.hypot(state.W, state.H) * (0.55 + Math.random() * 0.35);
        this.sx = state.W / 2 + Math.cos(ang) * rad;
        this.sy = state.H / 2 + Math.sin(ang) * rad;

        // 二次贝塞尔弧线：中点沿法线偏移，让路径带弧度不呆板
        const mx = (this.sx + tx) / 2;
        const my = (this.sy + ty) / 2;
        const bend = (Math.random() - 0.5) * 0.8;
        this.cx = mx - (ty - this.sy) * bend;
        this.cy = my + (tx - this.sx) * bend;

        // 从左到右「扫描式」进场 + 随机抖动
        this.delay = sweepAt(tx) + Math.random() * 140;
        this.dur = 900 + Math.random() * 600;
        this.r = gap * (0.44 + Math.random() * 0.18);

        this.x = this.sx; this.y = this.sy;
        this.grow = 0;
        this.landAt = -1;
      }

      update(now) {
        const t = (now - state.startTime - this.delay) / this.dur;
        this.grow = t <= 0 ? 0 : Math.min(1, t * 4);

        if (t <= 0) { this.x = this.sx; this.y = this.sy; return; }
        if (t >= 1) {
          if (this.landAt < 0) this.landAt = now;
          this.x = this.tx; this.y = this.ty;
          return;
        }
        const e = 1 - Math.pow(1 - t, 4);   // easeOutQuart：干脆利落地落位
        const a = (1 - e) * (1 - e);
        const b = 2 * (1 - e) * e;
        const c = e * e;
        this.x = a * this.sx + b * this.cx + c * this.tx;
        this.y = a * this.sy + b * this.cy + c * this.ty;
      }
    }

    /* ============ 渲染（单次 fill 批量绘制） ============ */
    function drawFrame(now) {
      const m = state.mouse;
      m.sx += (m.x - m.sx) * 0.22;   // 鼠标位置平滑
      m.sy += (m.y - m.sy) * 0.22;

      ctx.clearRect(0, 0, state.W, state.H);

      const R = 90, R2 = R * R;
      ctx.fillStyle = '#0a0a0a';
      ctx.beginPath();

      for (const p of state.particles) {
        p.update(now);
        let r = p.r * p.grow;
        if (r <= 0.05) continue;

        // 落地涟漪：到达后短暂膨胀再回落，随扫描方向形成波浪
        if (p.landAt > 0) {
          const k = 1 - (now - p.landAt) / 320;
          if (k > 0) r *= 1 + 0.9 * k;
        }

        // 鼠标斥力：只作用于绘制位置，不影响最终落点
        const dx = p.x - m.sx, dy = p.y - m.sy;
        const d2 = dx * dx + dy * dy;
        let x = p.x, y = p.y;
        if (d2 < R2) {
          const d = Math.sqrt(d2) || 1;
          const f = (R - d) / R;
          x += (dx / d) * f * f * 36;
          y += (dy / d) * f * f * 36;
        }

        ctx.moveTo(x + r, y);
        ctx.arc(x, y, r, 0, TAU);
      }
      ctx.fill();
    }

    function frame(now) {
      if (!state.running) return;
      drawFrame(now);
      if (!state.landed && now >= state.endTime) {
        state.landed = true;
        handoff();
      }
      requestAnimationFrame(frame);
    }

    /* ============ 粒子 → 矢量 无缝交接 ============ */
    function handoff() {
      // 1) 矢量 LOGO 先淡入，稍后粒子层才淡出
      brandContent.classList.add('active');
      timer(() => canvas.classList.add('hidden'), 200);

      // 2) 整体左移让位，字母依次飞入
      timer(() => {
        letters.forEach((el, i) => (el.style.transitionDelay = `${0.1 + i * 0.07}s`));
        brandContent.style.transform = `translateX(${-computeShift()}px)`;
        brandContent.classList.add('show-text');
        productVersion.classList.add('visible');
        timer(() => letters.forEach(el => (el.style.transitionDelay = '0s')), 1400);
      }, 450);

      // 3) 全部动画播放完毕后：停止渲染循环，并【在此处淡入展示右下角 Loading】
      timer(() => {
        state.running = false;
        state.finished = true;
        ctx.clearRect(0, 0, state.W, state.H);
        loaderContainer.classList.add('visible'); // LOGO动画完全结束后才显示加载动画
      }, 2100);
    }

    /* ============ 启动动画 ============ */
    function start() {
      cancelTimers();
      state.running = false;
      state.finished = false;
      state.landed = false;

      layout();
      brandContent.classList.remove('active', 'show-text');
      brandContent.style.transform = '';
      canvas.classList.remove('hidden');
      letters.forEach(el => (el.style.transitionDelay = '0s'));
      productVersion.classList.remove('visible');
      loaderContainer.classList.remove('visible'); // 保证开始时不展示 Loader

      if (reduced) { finishInstantly(); return; }

      const { pts, gap } = sampleLogo();
      if (!pts.length) { finishInstantly(); return; }

      // 按目标 x 坐标生成从左到右的扫描延迟
      let minX = Infinity, maxX = -Infinity;
      for (const p of pts) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
      }
      const span = Math.max(1, maxX - minX);
      const SWEEP = 650;
      const sweepAt = tx => ((tx - minX) / span) * SWEEP;

      state.particles = pts.map(pt => new Particle(pt.x, pt.y, gap, sweepAt));

      state.startTime = performance.now() + 150;
      state.endTime = state.startTime + SWEEP + 150 + 1500 + 100;

      state.running = true;
      requestAnimationFrame(frame);
    }

    function finishInstantly() {
      brandContent.classList.add('active', 'show-text');
      brandContent.style.transform = `translateX(${-computeShift()}px)`;
      canvas.classList.add('hidden');
      state.finished = true;
      productVersion.classList.add('visible');
      loaderContainer.classList.add('visible');
    }

    /* ============ 工具与事件 ============ */
    function timer(fn, ms) { state.timers.push(setTimeout(fn, ms)); }
    function cancelTimers() { state.timers.forEach(clearTimeout); state.timers = []; }

    window.addEventListener('pointermove', e => {
      state.mouse.x = e.clientX;
      state.mouse.y = e.clientY;
    });
    document.addEventListener('mouseleave', () => { state.mouse.x = state.mouse.y = -9999; });
    window.addEventListener('blur', () => { state.mouse.x = state.mouse.y = -9999; });

    let resizeTimer = 0;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (state.finished) {
          layout();  // 已完成：只重排版面
          brandContent.style.transform = `translateX(${-computeShift()}px)`;
        } else {
          start();   // 进行中：重启
        }
      }, 180);
    });

    start();
  })();
  </script>
</body>
</html>
