<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNSIAO - 高级品牌开场动画</title>
    <style>
        :root {
            --logo-height: 120px; /* JS 动态计算更新 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .brand-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }

        /* Canvas 高清粒子层 */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        canvas.fade-out {
            opacity: 0;
        }

        /* 矢量 LOGO 与 文字主容器 */
        .brand-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.8s ease;
            will-change: opacity;
        }

        .brand-content.active {
            opacity: 1;
        }

        /* 高清 SVG LOGO */
        .vector-logo {
            display: block;
            height: auto;
            flex-shrink: 0;
        }

        /* 右侧文字区域 */
        .brand-text {
            display: flex;
            align-items: center;
            gap: 18px;
            max-width: 0;
            opacity: 0;
            overflow: hidden;
            margin-left: 0;
            white-space: nowrap;
            transition: 
                max-width 1.8s cubic-bezier(0.16, 1, 0.3, 1),
                margin-left 1.8s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 1.0s ease;
        }

        .brand-content.show-text .brand-text {
            max-width: 2000px; /* 容纳等高的大文字 */
            opacity: 1;
            margin-left: 48px; /* LOGO 与文字间距 */
        }

        /* 字母样式：动态绑定 LOGO 高度，保持大写字母与 LOGO 1:1 等高 */
        .letter {
            display: inline-block;
            font-size: calc(var(--logo-height) * 1.08); /* 补偿大写字母行高，精准与 LOGO 顶底对齐 */
            line-height: 1;
            font-weight: 300; /* 修长优雅字重 */
            color: #0a0a0a;
            letter-spacing: 0.12em;
            opacity: 0;
            transform: translate3d(45px, 0, 0) scale(0.96);
            filter: blur(16px);
            transition: 
                opacity 1.2s ease, 
                transform 1.4s cubic-bezier(0.16, 1, 0.3, 1), 
                filter 1.2s ease;
            will-change: transform, opacity, filter;
        }

        .brand-content.show-text .letter {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
            filter: blur(0);
        }
    </style>
</head>
<body>

    <div class="brand-wrapper">
        <canvas id="particleCanvas"></canvas>

        <div class="brand-content" id="brandContent">
            <svg id="svgLogo" class="vector-logo" viewBox="0 0 1109 919" xmlns="http://www.w3.org/2000/svg">
                <path fill="#0a0a0a" d="M299.4 6.5 C354.6 6.2 409.8 6.4 465 6.4 471.6 6.5 478.3 5.8 484.8 7.4 497.1 10.3 508.7 19.1 512.5 31.5 515.5 41.1 516.6 51.6 514.2 61.5 509.6 79.1 504.9 96.6 499.7 114 492.8 138.1 486.1 162.2 479.2 186.2 473.2 209.3 466.1 232 460 255 437.4 336.4 414.7 417.8 392.2 499.2 380.1 540.7 369.4 582.4 357.8 624 346.5 664.5 335.3 705.1 324.6 745.8 318.8 767.3 313.4 788.9 307.3 810.3 301.2 833.1 295.5 856.1 289 878.8 286.6 887.9 282.1 896.6 275 902.9 266.8 909.9 255.5 912.3 245 911.6 180 911.6 115 911.7 50 911.6 35.7 912.1 21 904.3 14.6 891.3 9.2 880.2 10.5 867.1 13.3 855.4 19.5 830.3 27.3 805.6 34.5 780.8 37.9 768.9 41.9 757.3 45.2 745.4 57.6 703.3 70.7 661.4 83.1 619.3 89.4 599 95.2 578.5 101.5 558.2 107.8 537.8 113.7 517.3 120 496.9 131.2 461.2 141.8 425.2 153.4 389.6 167.3 344.7 181.1 299.8 195.2 255 208.9 209.5 223.8 164.4 238.1 119.2 247.9 90.1 256.5 60.7 266.7 31.8 271.6 18.1 284.5 6.8 299.4 6.5Z M581.4 6.5 C603.6 6.1 625.8 6.5 648 6.4 676.3 6.3 704.7 6.3 733 6.3 744.4 6.5 755.5 11.5 762.7 20.3 769.7 27.7 770.8 38.3 771.4 48 771.9 56.8 768.9 65.2 767.4 73.7 763.9 93.2 759.8 112.6 755.7 131.9 742.3 202.1 727.5 271.9 714.8 342.2 713.3 353.3 710.2 364.6 712.4 375.8 714.4 384.8 722 391.5 730.5 394.6 736 397 742 397.8 748 397.6 800.3 397.7 852.6 397.6 905 397.7 916.3 397.5 927.6 402.4 935.1 410.9 941.2 417.2 943.3 426 946.1 434.1 951.4 448.8 955.9 463.8 961.4 478.5 970.7 503.1 979.7 527.9 988.3 552.8 994.4 570.9 1001.5 588.5 1007.5 606.5 1016.9 630.7 1023.7 655.7 1033.2 679.7 1047.5 715.5 1061.6 751.4 1074.2 787.9 1079.6 801.9 1084 816.4 1089.7 830.3 1092.2 837 1094.7 843.7 1096.9 850.5 1100.2 861.7 1101.2 874 1097.2 885.1 1093.4 896.2 1084.1 905.2 1073.1 908.9 1065.4 911.9 1057.1 911.5 1049 911.5 900 911.7 751 911.5 602 911.6 587.4 911.6 572.4 903.7 565.7 890.4 562.2 883.5 561.4 875.6 561.9 868 563.3 852.1 567.3 836.6 570.4 820.9 579.3 777.9 588.4 734.9 598 692 613.2 625 627 557.6 642.3 490.6 643.8 482.4 646.2 474.3 647.2 466 648 460.1 646.7 453.8 643.1 449 636.6 439.6 625.4 433.8 614 433.7 572 433.6 530 433.7 488 433.7 477.7 433.8 466.6 430.3 460.2 421.8 454.1 414.7 451.5 405.2 451.5 396 451.3 388.8 453.8 382 455.3 375.1 460.9 354.9 465.8 334.5 471.1 314.2 477.1 291.9 483.8 269.8 489.6 247.4 495.9 224.2 502.1 201 508.9 177.9 513.6 160.1 518.5 142.4 523.6 124.7 530.4 99.9 537.1 75.1 544.3 50.3 546.4 43.4 547.6 36.1 550.7 29.5 555.7 17.1 567.9 7.5 581.4 6.5Z"/>
            </svg>

            <div class="brand-text" id="brandText">
                <span class="letter">U</span>
                <span class="letter">N</span>
                <span class="letter">S</span>
                <span class="letter">I</span>
                <span class="letter">A</span>
                <span class="letter">O</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const brandContent = document.getElementById('brandContent');
        const svgLogo = document.getElementById('svgLogo');
        const letters = document.querySelectorAll('.letter');

        const svgPathData = `M299.4 6.5 C354.6 6.2 409.8 6.4 465 6.4 471.6 6.5 478.3 5.8 484.8 7.4 497.1 10.3 508.7 19.1 512.5 31.5 515.5 41.1 516.6 51.6 514.2 61.5 509.6 79.1 504.9 96.6 499.7 114 492.8 138.1 486.1 162.2 479.2 186.2 473.2 209.3 466.1 232 460 255 437.4 336.4 414.7 417.8 392.2 499.2 380.1 540.7 369.4 582.4 357.8 624 346.5 664.5 335.3 705.1 324.6 745.8 318.8 767.3 313.4 788.9 307.3 810.3 301.2 833.1 295.5 856.1 289 878.8 286.6 887.9 282.1 896.6 275 902.9 266.8 909.9 255.5 912.3 245 911.6 180 911.6 115 911.7 50 911.6 35.7 912.1 21 904.3 14.6 891.3 9.2 880.2 10.5 867.1 13.3 855.4 19.5 830.3 27.3 805.6 34.5 780.8 37.9 768.9 41.9 757.3 45.2 745.4 57.6 703.3 70.7 661.4 83.1 619.3 89.4 599 95.2 578.5 101.5 558.2 107.8 537.8 113.7 517.3 120 496.9 131.2 461.2 141.8 425.2 153.4 389.6 167.3 344.7 181.1 299.8 195.2 255 208.9 209.5 223.8 164.4 238.1 119.2 247.9 90.1 256.5 60.7 266.7 31.8 271.6 18.1 284.5 6.8 299.4 6.5Z M581.4 6.5 C603.6 6.1 625.8 6.5 648 6.4 676.3 6.3 704.7 6.3 733 6.3 744.4 6.5 755.5 11.5 762.7 20.3 769.7 27.7 770.8 38.3 771.4 48 771.9 56.8 768.9 65.2 767.4 73.7 763.9 93.2 759.8 112.6 755.7 131.9 742.3 202.1 727.5 271.9 714.8 342.2 713.3 353.3 710.2 364.6 712.4 375.8 714.4 384.8 722 391.5 730.5 394.6 736 397 742 397.8 748 397.6 800.3 397.7 852.6 397.6 905 397.7 916.3 397.5 927.6 402.4 935.1 410.9 941.2 417.2 943.3 426 946.1 434.1 951.4 448.8 955.9 463.8 961.4 478.5 970.7 503.1 979.7 527.9 988.3 552.8 994.4 570.9 1001.5 588.5 1007.5 606.5 1016.9 630.7 1023.7 655.7 1033.2 679.7 1047.5 715.5 1061.6 751.4 1074.2 787.9 1079.6 801.9 1084 816.4 1089.7 830.3 1092.2 837 1094.7 843.7 1096.9 850.5 1100.2 861.7 1101.2 874 1097.2 885.1 1093.4 896.2 1084.1 905.2 1073.1 908.9 1065.4 911.9 1057.1 911.5 1049 911.5 900 911.7 751 911.5 602 911.6 587.4 911.6 572.4 903.7 565.7 890.4 562.2 883.5 561.4 875.6 561.9 868 563.3 852.1 567.3 836.6 570.4 820.9 579.3 777.9 588.4 734.9 598 692 613.2 625 627 557.6 642.3 490.6 643.8 482.4 646.2 474.3 647.2 466 648 460.1 646.7 453.8 643.1 449 636.6 439.6 625.4 433.8 614 433.7 572 433.6 530 433.7 488 433.7 477.7 433.8 466.6 430.3 460.2 421.8 454.1 414.7 451.5 405.2 451.5 396 451.3 388.8 453.8 382 455.3 375.1 460.9 354.9 465.8 334.5 471.1 314.2 477.1 291.9 483.8 269.8 489.6 247.4 495.9 224.2 502.1 201 508.9 177.9 513.6 160.1 518.5 142.4 523.6 124.7 530.4 99.9 537.1 75.1 544.3 50.3 546.4 43.4 547.6 36.1 550.7 29.5 555.7 17.1 567.9 7.5 581.4 6.5Z`;

        let particles = [];
        let isTransitioned = false;
        let animationFrameId = null;
        let dpr = 1;

        class SlowSpringParticle {
            constructor(targetX, targetY) {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.max(window.innerWidth, window.innerHeight) * (0.4 + Math.random() * 0.6);

                this.x = window.innerWidth / 2 + Math.cos(angle) * distance;
                this.y = window.innerHeight / 2 + Math.sin(angle) * distance;
                this.targetX = targetX;
                this.targetY = targetY;

                this.vx = 0;
                this.vy = 0;
                this.friction = 0.88 + Math.random() * 0.04; 
                this.spring = 0.007 + Math.random() * 0.008;

                this.radius = 1.0 + Math.random() * 1.2;
                this.alpha = 0.2 + Math.random() * 0.7;
            }

            update() {
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;

                this.vx += dx * this.spring;
                this.vy += dy * this.spring;
                this.vx *= this.friction;
                this.vy *= this.friction;

                this.x += this.vx;
                this.y += this.vy;

                return Math.abs(dx) + Math.abs(dy);
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(10, 10, 10, ${this.alpha})`;
                ctx.fill();
            }
        }

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            
            const w = window.innerWidth;
            const h = window.innerHeight;

            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.scale(dpr, dpr);

            const svgWidth = 1109;
            const svgHeight = 919;

            // 根据屏幕比例确定 LOGO 高度
            const renderHeight = Math.min(w, h) * 0.20; 
            const renderWidth = (renderHeight / svgHeight) * svgWidth;

            svgLogo.style.width = `${renderWidth}px`;
            svgLogo.style.height = `${renderHeight}px`;

            // 动态设置 CSS 变量，确保字母与 LOGO 高度高度对齐
            document.documentElement.style.setProperty('--logo-height', `${renderHeight}px`);

            const targetPoints = generateSamplePoints(renderWidth, renderHeight);
            initParticles(targetPoints);
        }

        function generateSamplePoints(renderWidth, renderHeight) {
            const points = [];
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');

            tempCanvas.width = renderWidth;
            tempCanvas.height = renderHeight;

            const scale = renderHeight / 919;
            tempCtx.scale(scale, scale);
            tempCtx.fillStyle = '#000000';
            tempCtx.fill(new Path2D(svgPathData));

            const imgData = tempCtx.getImageData(0, 0, renderWidth, renderHeight).data;
            const step = 4;

            const startX = (window.innerWidth - renderWidth) / 2;
            const startY = (window.innerHeight - renderHeight) / 2;

            for (let y = 0; y < renderHeight; y += step) {
                for (let x = 0; x < renderWidth; x += step) {
                    const alphaIndex = (y * Math.floor(renderWidth) + x) * 4 + 3;
                    if (imgData[alphaIndex] > 128) {
                        points.push({
                            x: startX + x,
                            y: startY + y
                        });
                    }
                }
            }
            return points;
        }

        function initParticles(targetPoints) {
            particles = targetPoints.map(pt => new SlowSpringParticle(pt.x, pt.y));
            isTransitioned = false;

            canvas.classList.remove('fade-out');
            brandContent.classList.remove('active', 'show-text');

            letters.forEach((letter, idx) => {
                letter.style.transitionDelay = `${idx * 0.15}s`;
            });
        }

        function animate() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            let totalOffset = 0;

            for (let i = 0; i < particles.length; i++) {
                totalOffset += particles[i].update();
                particles[i].draw();
            }

            const avgOffset = totalOffset / particles.length;

            if (avgOffset < 0.6 && !isTransitioned) {
                isTransitioned = true;

                brandContent.classList.add('active');
                canvas.classList.add('fade-out');

                setTimeout(() => {
                    brandContent.classList.add('show-text');
                }, 600);
            }

            animationFrameId = requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            resize();
            animate();
        });

        resize();
        animate();
    </script>
</body>
</html>
