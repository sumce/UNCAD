# UNCAD 全量单测 CI:手动触发。当前没有注册的 self-hosted runner,
# 自动挂起只会制造 pending；托管 runner 又跑不了 AutoCAD 运行时测试。
# 本地与 CI 同源:直接复用 scripts/ci-local.ps1，含"执行数 == 源码期望数"
# 门禁，防 xunit 静默跳过整程序集的假绿。runner 上线后可恢复 push 触发。
#
# 为什么必须 self-hosted:测试项目经 $(AutoCADDir) HintPath 引用本机安装的
# AutoCAD 2022 托管程序集(tests/UNCAD.Tests/UNCAD.Tests.csproj 默认
# "D:\Program Files\Autodesk\AutoCAD 2022"),GitHub 托管 runner 上的
# Autodesk NuGet 包只是引用程序集,运行 AutoCAD API 会抛 InvalidProgramException。
# runner 机器要求:已安装 AutoCAD 2022 且位于默认路径;若换路径,须统一改传
# AutoCADDir 属性并同步下方检查。
#
# PR 不再触发本 workflow:fork PR 的代码不能在自托管机器上执行。
# PR 与 main push 的编译检查由 build-hosted.yml 在 GitHub 托管 runner 上完成。
# 本 workflow 只在手动触发时运行，等 self-hosted runner 注册后再恢复 push。
name: tests

on:
  workflow_dispatch:

# 同一 ref 只保留最新一次运行,防止连续 push 在单台 self-hosted 机器上堆积。
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # AutoCAD 程序集走本机 HintPath,托管 runner 拿不到 → 只能 self-hosted。
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      # fail fast:先把"runner 机器不满足构建前提"与"代码测试失败"区分开。
      - name: 检查 AutoCAD 2022 目录
        shell: powershell
        run: |
          $acad = 'D:\Program Files\Autodesk\AutoCAD 2022'
          if (-not (Test-Path -LiteralPath $acad -PathType Container)) {
            Write-Host ("::error::runner 机器缺少 AutoCAD 2022(期望 {0})。UNCAD.Tests 经 AutoCADDir HintPath 引用该目录下的 Ac*.dll/AdWindows.dll,缺失则无法构建;请在 runner 上安装 AutoCAD 2022 到默认路径,或统一改传 AutoCADDir 属性并同步修改本检查。" -f $acad)
            exit 1
          }
          Write-Host "AutoCAD 目录就绪: $acad"

      # 以子进程调用并透传退出码(0 成功 / 1 测试或门禁失败 / 2 并发保护 / 3 环境);
      # 脚本内部自带并发保护、tmp\ci\ 日志落盘与期望数门禁。
      - name: 运行本地 CI 脚本
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\ci-local.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
