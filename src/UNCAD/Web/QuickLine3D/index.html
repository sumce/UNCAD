<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>U1LX 3D 距离编辑</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" aria-label="U1LX 3D 距离编辑">
        <span class="brand-code">U1LX</span>
        <span class="brand-title">3D 距离编辑</span>
      </div>
      <div class="toolbar" role="toolbar" aria-label="三维视图工具">
        <div class="segmented" aria-label="操作模式">
          <button id="orbitMode" class="tool active" type="button" title="旋转与平移视图">旋转</button>
          <button id="selectMode" class="tool" type="button" title="单击或拖框选择线段">框选</button>
        </div>
        <button id="fitView" class="tool command" type="button" title="使全部线段适应窗口">适应视图</button>
        <label class="projection-control" title="选择正交草图的两个实际空间轴">
          <span>正交平面</span>
          <select id="orthographicPlane" aria-label="正交平面">
            <option value="XZ" selected>X / Z</option>
            <option value="XY">X / Y</option>
            <option value="YZ">Y / Z</option>
          </select>
        </label>
        <label class="toggle" title="显示或隐藏毫米标注">
          <input id="labelsToggle" type="checkbox" checked>
          <span>距离标注</span>
        </label>
        <label class="toggle" title="交换 X 与 Y 轴映射">
          <input id="swapAxes" type="checkbox">
          <span>交换 X/Y</span>
        </label>
        <label class="toggle" title="翻转竖向轴">
          <input id="flipZ" type="checkbox">
          <span>反向 Z</span>
        </label>
      </div>
      <div class="scene-meta">
        <span id="segmentCount">0 段</span>
        <span id="selectionCount">未选择</span>
      </div>
    </header>

    <main class="workspace">
      <section id="viewport" aria-label="三维线路视图">
        <div id="canvasHost"></div>
        <div id="labelsLayer" aria-hidden="true"></div>
        <div id="selectionBox" aria-hidden="true"></div>
        <div id="axisLegend" aria-label="坐标轴图例">
          <span class="axis-x">X</span>
          <span class="axis-y">Y</span>
          <span class="axis-z">Z</span>
        </div>
        <div id="loadingState" role="status">正在建立三维线路...</div>
      </section>

      <aside class="inspector" aria-label="线段属性">
        <section class="inspector-section selection-section">
          <div class="section-heading">
            <h2>选中线段</h2>
            <button id="clearSelection" type="button" class="text-command">清除</button>
          </div>
          <div class="metric-grid">
            <div><span class="metric-label">数量</span><strong id="selectedMetric">0</strong></div>
            <div><span class="metric-label">方向</span><strong id="axisMetric">-</strong></div>
            <div><span class="metric-label">平面角</span><strong id="angleMetric">-</strong></div>
            <div><span class="metric-label">当前距离</span><strong id="distanceMetric">-</strong></div>
          </div>
        </section>

        <section class="inspector-section distance-section">
          <label>快速填写距离</label>
          <div id="quickInputDisplay" class="quick-input-display">点击 3D 线段开始</div>
          <div id="quickInputHint" class="quick-input-hint">直接输入数字，按 Enter 写入当前线段</div>
          <div id="validationMessage" class="validation" role="alert"></div>
        </section>

        <section class="inspector-section list-section">
          <div class="section-heading">
            <h2>线路明细</h2>
            <span id="changedCount" class="changed-count">0 项修改</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>线段</th><th>轴</th><th>距离</th></tr>
              </thead>
              <tbody id="segmentRows"></tbody>
            </table>
          </div>
        </section>

        <section id="diagnosticSection" class="inspector-section diagnostics" hidden>
          <h2>诊断</h2>
          <ul id="diagnosticList"></ul>
        </section>
      </aside>
    </main>

    <footer class="commandbar">
      <div id="statusText" role="status">等待线路数据</div>
      <div class="footer-actions">
        <button id="cancelButton" type="button" class="secondary">取消</button>
        <button id="commitButton" type="button" class="primary">写回 CAD</button>
      </div>
    </footer>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
