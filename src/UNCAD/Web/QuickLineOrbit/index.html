<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>U1U 路由 3D 预览</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="pane">
    <div id="viewport" aria-label="U1U 三维路由预览">
      <div id="canvasHost"></div>
      <div id="loading">正在启动三维渲染器...</div>
      <div id="labelLayer" aria-hidden="true"></div>
      <div id="summary" class="overlay-text overlay-bottom-left">左键拖动=旋转 · 滚轮=缩放 · 右键拖动=平移 · 双击=复位</div>
      <div id="legend" class="overlay-text overlay-bottom-left overlay-stacked">橙X 绿Y 蓝Z　红=桥架(宽) 青=线管</div>
      <div class="overlay-actions">
        <button id="gridButton" type="button" title="显示或隐藏地面柱网">柱网 开</button>
        <button id="refButton" type="button" title="显示或隐藏标高参照层">参照 开</button>
        <button id="resetButton" type="button" title="复位视角">复位</button>
      </div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
